<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Edit Student</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <div class="form-container">

        <h1>Edit Student</h1>

        <form method="POST">

            <label>Student ID</label>

            <input
                type="text"
                value="{{ student.student_id }}"
                disabled
            >


            <label>Name</label>

            <input
                type="text"
                name="name"
                value="{{ student.name }}"
                required
            >


            <label>Email</label>

            <input
                type="email"
                name="email"
                value="{{ student.email }}"
            >


            <label>Phone</label>

            <input
                type="text"
                name="phone"
                value="{{ student.phone }}"
            >


            <label>Gender</label>

            <select name="gender">

                <option
                    value="Male"
                    {% if student.gender == "Male" %}selected{% endif %}>
                    Male
                </option>

                <option
                    value="Female"
                    {% if student.gender == "Female" %}selected{% endif %}>
                    Female
                </option>

                <option
                    value="Other"
                    {% if student.gender == "Other" %}selected{% endif %}>
                    Other
                </option>

            </select>


            <label>Course</label>

            <input
                type="text"
                name="course"
                value="{{ student.course }}"
            >


            <label>Year</label>

            <select name="year">

                <option value="1"
                    {% if student.year == 1 %}selected{% endif %}>
                    1st Year
                </option>

                <option value="2"
                    {% if student.year == 2 %}selected{% endif %}>
                    2nd Year
                </option>

                <option value="3"
                    {% if student.year == 3 %}selected{% endif %}>
                    3rd Year
                </option>

                <option value="4"
                    {% if student.year == 4 %}selected{% endif %}>
                    4th Year
                </option>

            </select>


            <label>Department</label>

            <input
                type="text"
                name="department"
                value="{{ student.department }}"
            >


            <label>Address</label>

            <textarea
                name="address"
                rows="4">{{ student.address }}</textarea>


            <button type="submit">
                Update Student
            </button>

            <a
                href="{{ url_for('students') }}"
                class="cancel-btn">
                Cancel
            </a>

        </form>

    </div>

</body>

</html>
